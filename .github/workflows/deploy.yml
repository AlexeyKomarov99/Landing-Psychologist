name: Deploy to Beget  # Название workflow

on:
  push:
    branches: [ main ]  # Запуск при пуше в ветку main

jobs:
  deploy:
    runs-on: ubuntu-latest  # Среда выполнения

    steps:
      # 1. Клонируем репозиторий
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. (Опционально) Сборка проекта
      - name: Build project
        run: |
          npm install
          npm run build
        # Убери или измени эти команды под свой проект

      # 3. Загрузка на хостинг через FTP
      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ftp.yoursite.beget.com  # FTP-сервер Beget
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/  # Папка с файлами для загрузки
          server-dir: /public_html/  # Целевая папка на хостинге